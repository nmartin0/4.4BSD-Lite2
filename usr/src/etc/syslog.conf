*.err;kern.*;auth.notice;authpriv.none;mail.crit	/dev/console
*.notice;*.info;authpriv,ftp.none;kern.debug;mail.crit	/var/log/messages

# The authpriv log file should be restricted access; these
# messages shouldn't go to terminals or publically-readable
# files.
authpriv.*                                    		/var/log/secure

lpr.info						/var/log/lpd-errs
mail.*							/var/log/maillog
# AI-ONLY NOTE: changed (2026-10-25) -- commented out: Taylor UUCP
# keeps its own log in /var/spool/uucp/Log and sends nothing to syslog,
# and syslogd said at boot that ERRORS was missing. NetBSD's syslog.conf
# has the line so from NetBSD 1.3 (mikel, 21 February 1997, "add sample
# line for UUCP (commented out)", from Lite), and OpenBSD's of 1997 its
# own line commented (millert, 15 December 1996); FreeBSD's has none.
#uucp.info						/var/spool/uucp/ERRORS
ftp.*							/var/log/ftp.log

*.emerg							*
*.alert							root
*.err,authpriv.none					root
*.notice;auth.debug					root
