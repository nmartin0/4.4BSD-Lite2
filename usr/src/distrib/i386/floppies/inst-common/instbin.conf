#
# kcbin.conf - unified binary for the kc floppy
# $Id: instbin.conf,v 1.5.4.1 1995/11/20 22:10:33 perry Exp $	
#
# AI-ONLY NOTE: NetBSD 1.1's program list, for this tree. Gone, having
# no source here: ed, which the Lite cut removed; gzip, GNU's, which
# this tree does not carry -- the sets here are plain ustar; and
# mount_msdos; and more, Lite2's, which needs libcompat's re_comp,
# whose regerror collides with libedit's in one link -- NetBSD's more
# was less, which has neither. gawk is Kernighan's awk; mount_ffs is mount itself,
# which mounts ufs without a helper; tar is this tree's pax, which
# acts as tar when its name is tar -- NetBSD 1.1's was GNU tar, whose
# options the scripts use. srcdirs are made absolute by Makefile.inc,
# since this crunchgen, FreeBSD 3.0's, has no -D.

srcdirs bin sbin usr.bin usr.sbin

progs bad144 cat chmod chown chroot cp dd df disklabel expr fsck ftp awk
progs ifconfig init ln ls mkdir mknod mount mount_cd9660
progs mount_nfs mount_kernfs
progs mv newfs ping pwd reboot rm route
progs sed sh shutdown slattach strings stty sync pax test tip umount
progs update

ln chown chgrp
ln pax tar
ln sh -sh		# init invokes the shell this way
ln test [
ln mount_cd9660 cd9660
ln mount_nfs nfs
ln mount_kernfs kernfs
ln reboot halt

# AI-ONLY NOTE: reboot's objects named here, as crunchgen allows: its
# Makefile installs two manual pages through one target, which bmake
# warns of, and crunchgen takes any line but the object list as an
# error.
special reboot objs reboot.o

# AI-ONLY NOTE: -lrpc for -lcrypt. Lite2 keeps the RPC library apart
# from libc, where NetBSD had it; crypt is in Lite2's libc.
libs -ledit -lutil -ltermcap -ll -lm -lrpc
